<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Batch-oriented Bloom filter queries</title>
  <desc id="desc">4096 hashed keys, four probe words within one cache line per key, and a dense membership output.</desc>
  <rect width="900" height="180" fill="#fff"/>
  <path d="M0 1H900M0 179H900" stroke="#e2e8f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="28" y="47" fill="#64748b" font-size="12" letter-spacing="1.5">INPUT</text>
    <text x="28" y="86" fill="#0f172a" font-size="24" font-weight="600">4096 keys</text>
    <text x="28" y="116" fill="#64748b" font-size="14">Uniform 64-bit hashes</text>
    <path d="M230 87H285m-8-5 8 5-8 5" fill="none" stroke="#1e5c9b" stroke-width="1.5"/>
    <text x="320" y="47" fill="#64748b" font-size="12" letter-spacing="1.5">FOURSECTORRANGE12</text>
    <g fill="#e8edfb" stroke="#b6c8df">
      <rect x="320" y="66" width="66" height="39" rx="3"/>
      <rect x="393" y="66" width="66" height="39" rx="3"/>
      <rect x="466" y="66" width="66" height="39" rx="3"/>
      <rect x="539" y="66" width="66" height="39" rx="3"/>
    </g>
    <g fill="#1e5c9b" font-size="14" text-anchor="middle">
      <text x="353" y="91">3 bits</text><text x="426" y="91">3 bits</text>
      <text x="499" y="91">3 bits</text><text x="572" y="91">3 bits</text>
    </g>
    <text x="320" y="133" fill="#64748b" font-size="14">Four words · one cache line per key</text>
    <path d="M640 87H695m-8-5 8 5-8 5" fill="none" stroke="#1e5c9b" stroke-width="1.5"/>
    <text x="730" y="47" fill="#64748b" font-size="12" letter-spacing="1.5">OUTPUT</text>
    <text x="730" y="86" fill="#0f172a" font-size="24" font-weight="600">0 / 1</text>
    <text x="730" y="116" fill="#64748b" font-size="14">One result per key</text>
  </g>
</svg>
