[build-system]
requires = ["setuptools>=69.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "blowchoc"
version = "1.1.0"

license = {file = "LICENSE"}

authors = [
  { name="Johanna Schmitz", email="jschmitz@cs.uni-saarland.de" },
  { name="Jens Zentgraf", email="zentgraf@cs.uni-saarland.de" },
  { name="Sven Rahmann", email="rahmann@cs.uni-saarland.de" }
]

description = "Bloom, Blocked Bloom and Blocked Bloom filters with choices."

readme = "README.md"

requires-python = ">=3.12"

dependencies = [
  "numpy",
  "numba",
  "pytest",
  "pip",
]

scripts = {blowchoc = "blowchoc.blowchoc.blowchoc_main:main"}

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.urls]
"Homepage" = "https://gitlab.com/rahmannlab/blowchoc-filters"
"Bug Tracker" = "https://gitlab.com/rahmannlab/blowchoc-filters/issues"

[tool.setuptools]
packages=["blowchoc"]
